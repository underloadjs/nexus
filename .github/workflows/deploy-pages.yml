# Deploys the Nexus Monitor (this repository's root app) to GitHub Pages.
#
# WHAT THIS REPO IS: the read-only observability console for a nexus hub — a
# static Vite + React app that polls the hub's GET /v1/observe and GET /metrics
# APIs. The Rust hub those APIs are served by is a separate package now
# (noobscript `services/nexus`, `@services/nexus`), so there is no cargo build
# in this workflow and no Rust path filter to skip: the only buildable thing
# tracked here is the site.
#
# WHY THE WORKFLOW LIVES HERE (not in the noobscript monorepo root):
# this directory is its own git repository (origin underloadjs/nexus). Inside
# the monorepo it is an embedded repo, so the root repo never sees anything
# under it and a root-level workflow could neither trigger on these files nor
# upload an artifact built from them. The package therefore ships its own
# workflow, exactly like the sibling standalone mirrors do:
# packages/underload/bench/.github/workflows/deploy-pages.yml,
# packages/underload/dashboard/.github/workflows/deploy-pages.yml,
# packages/underload/harness/.github/workflows/ci.yml and every
# distribution/* package. GitHub runs it once this repo is pushed on its own.
#
# Every path below is RELATIVE TO THIS REPO, and the app sits AT THE ROOT of it
# (index.html, src/, vite.config.ts) — same layout as those siblings, and no
# working-directory is needed on any step.
#
# ARTIFACT FLOW (why configure-pages/upload/deploy-pages instead of a gh-pages
# branch push), carried over from distribution/story-generator
# (.github/workflows/deploy.yml), which documents the failure this replaces:
# pushing dist/ onto a `gh-pages` branch relies on Pages' "Deploy from a
# branch" job, which silently stopped triggering there (gh-pages commits landed
# green while the live site kept serving an older bundle). The official artifact
# flow — configure-pages reads/applies the Pages settings, upload-pages-artifact
# packages the build output as the `github-pages` artifact, deploy-pages
# publishes that artifact — depends on no branch at all.
# Note the split: upload-pages-artifact runs in `build`, the job that produced
# dist/, and `deploy` only runs deploy-pages@v4, which downloads that artifact
# by itself; the deploy job has no checkout, so it has no dist/ of its own.
#
# ONE-TIME REPO SETTING (required once, not per deploy):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
# Documented again in README.md.
#
# YARN 1, PINNED, THROUGH A GLOBAL NPM INSTALL — same reasoning as
# packages/underload/dashboard/.github/workflows/deploy-pages.yml, restated
# here because the rationale is easy to undo by accident:
#   - Why not npm: npm 11.5.1 (bundled with Node 24) fails structurally on a
#     clean standalone install of this dependency tree — @npmcli/arborist
#     throws "Cannot read properties of undefined (reading 'edgesOut')" while
#     resolving the vitest 4 peer graph. Reproduced with an isolated cache and
#     userconfig, so it is not a stale-node_modules artifact.
#   - Why Yarn 1: it is the host/CI toolchain of the monorepo this package is
#     developed in (root package.json has "packageManager": "yarn@1.22.22"), so
#     CI resolves exactly like local development does.
#   - Why an explicit global install instead of corepack: corepack is on its way
#     out of Node, needs COREPACK_ENABLE_DOWNLOAD_PROMPT=0 in CI, and without a
#     `packageManager` field in this repo it would resolve through its
#     lastKnownGood channel. `npm install --global yarn@1.22.22` is one command,
#     one exact version. It only touches npm's GLOBAL tree, so it stays clear of
#     the arborist peer-graph failure above.
#
# LOCKFILE: yarn.lock IS committed here, so the install below is
# `--frozen-lockfile` (byte-reproducible CI installs). It is the standalone
# lockfile of this repo: inside the noobscript monorepo the same manifest is a
# workspace member, and a root install hoists these dependencies instead
# (README "Two install contexts, one manifest"). actions/setup-node's `cache:`
# is intentionally NOT set (packages/underload/dashboard leaves it off too;
# bench turns it on) — a cold install of this dev-dep tree is a few minutes once
# per deploy, and an unset cache is one fewer key to keep valid. Turn it on if
# the wait ever matters: the lockfile is at this repo's root, so `cache: yarn`
# resolves the same way it does in bench.

name: Deploy Nexus Monitor to GitHub Pages

on:
    push:
        branches: [main]
        paths:
            - src/**
            - index.html
            - package.json
            - yarn.lock
            - tsconfig.json
            - vite.config.ts
            - .github/workflows/deploy-pages.yml
    workflow_dispatch:

# LEAST PRIVILEGE, declared at WORKFLOW top level (not per job) — matching the
# sibling mirrors packages/underload/bench/.github/workflows/deploy-pages.yml and
# distribution/story-generator/.github/workflows/deploy.yml.
# WHY top level: actions/configure-pages@v5 runs in the `build` job (it is the step
# that reads/applies the Pages settings before the artifact upload), so `build` also
# needs pages: write + id-token: write. Declaring these only on `deploy` leaves
# `build` on the workflow's default token scope, and the first run on a fresh repo
# then dies in Configure Pages with an opaque permissions error. contents stays
# read: nothing here writes to the repository (no gh-pages branch push).
permissions:
    contents: read
    pages: write
    id-token: write

# cancel-in-progress is FALSE on purpose: cancelling a run mid-deploy can leave the
# Pages environment half-published. A newer push queues instead of pre-empting.
# Top level so a newer push cannot start a second `build` while one is running
# either; `group: pages` keeps this workflow's runs in one queue.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        # Pinned while ubuntu-latest migrates to Ubuntu 26 (runner-images
        # #14748), matching the bench and dashboard Pages workflows.
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            # Node first: `npm install --global yarn@...` in the next step needs
            # this Node/npm, not the runner image's preinstalled one.
            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version: 24

            - name: Setup Yarn 1 (pinned)
              run: npm install --global yarn@1.22.22

            # No workspace root in this repo, so yarn treats the checkout root as
            # the project itself (its own yarn.lock + node_modules).
            - name: Install dependencies
              # --frozen-lockfile: fails instead of silently resolving a new
              # tree when package.json and the committed lockfile drift.
              run: yarn install --frozen-lockfile

            # Gate the site before publishing it: program + config typecheck,
            # then the vitest suite (node environment, no jsdom needed).
            - name: Typecheck
              run: yarn typecheck

            - name: Test
              run: yarn test

            # Pages serves this repo at https://<owner>.github.io/<repo-name>/
            # (currently /nexus/), so Vite must rewrite every asset URL to that
            # subpath — a default '/' base would 404 all assets. The repo name is
            # used rather than a literal so a rename/fork keeps working.
            - name: Build
              run: yarn build --base=/${{ github.event.repository.name }}/

            - name: Configure Pages
              uses: actions/configure-pages@v5

            # Uploads from THIS job (the one that just built dist/);
            # deploy-pages in `deploy` consumes this as the `github-pages`
            # artifact. See the artifact-flow note in the header.
            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

    deploy:
        needs: build
        runs-on: ubuntu-24.04
        # Permissions (pages: write + id-token for deploy-pages@v4) and the
        # `pages` concurrency group are declared once, at workflow top level —
        # see the notes above the `jobs:` key.
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
