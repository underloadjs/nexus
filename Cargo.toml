# =============================================================================
# nexus — standalone Cargo workspace.
#
# WHY `members` + explicit `[workspace]` HERE instead of joining the root Rust
# workspace: the user asked for this package specifically at
# packages/underload/nexus. root rust/README.md + MIGRATION.md recommend a single
# root workspace, but an ancestor `package.json`-only repo layout makes nested
# crates ambiguous; declaring `[workspace]` here stops cargo from walking up and
# erroring with "package is a member of two workspaces" / "not a member of
# workspace". `.cargo/config.toml` at the repo root still governs this workspace
# on purpose: target-dir = .rust/target, TMP/TEMP/TMPDIR = Temp/rust, and the
# wasm32-unknown-unknown +simd128 rustflags all inherit from it.
# =============================================================================
[workspace]
resolver = "2"
members = [
    "crates/nexus-core",
    "crates/nexus-wasm",
    "crates/nexus-server",
    "crates/nexus-worker-example",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/underloadjs/nexus"
publish = false

# ---------------------------------------------------------------------------
# Shared dependency graph. Every entry below resolved against the live registry
# on the pinned toolchain (see README "Verification status"); the resulting graph
# is committed in this package's `Cargo.lock`, so `--locked` builds are
# reproducible. Versions are caret requirements, not exact pins.
# ---------------------------------------------------------------------------
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
tracing = "0.1"

# Native runtime only. None of these may leak into nexus-core: the core crate is
# what wasm32-unknown-unknown compiles, and tokio's IO/time drivers do not exist
# there.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "io-util", "signal"] }
axum = { version = "0.8", features = ["ws", "json", "query"] }
tower-http = { version = "0.6", features = ["limit", "trace"] }
tokio-stream = { version = "0.1", features = ["sync", "time"] }
tokio-tungstenite = { version = "0.26", features = ["connect"] }
anyhow = "1"
futures-util = "0.3"
# Body inspection in tests only (`io::serve_artifact`'s chunking and aborts). It is
# the crate `axum`'s body type is defined against, so no second body abstraction is
# introduced; kept out of `[dependencies]` so shipping code never reaches for it.
http-body-util = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# The broker is a server: silent unwrap on a parsed boundary is a crash we have
# to pay for, but tests and main() are allowed to be blunt.
unwrap_used = "warn"
expect_used = "warn"
needless_pass_by_value = "allow"

# ---------------------------------------------------------------------------
# Native release profile — the task asks for an "optimized Rust server".
# Decisions, all deliberate:
#   * panic = "abort": smaller binary + no unwinding across the actor loop. The
#     actor never panics on parsed input (every path returns a Result), so an
#     abort is a genuine fail-stop for a single-replica broker. Tests keep
#     unwind (cargo forces `panic = "unwind"` on the test profile) so a failing
#     assertion reports instead of killing the harness.
#   * lto = "fat" + codegen-units = 1: max cross-crate inlining for the hot
#     frame/relay paths; +build-time, and this ships once.
#   * incremental = false: release builds are never edited-then-rebuilt.
#   * debug = "line-tables-only": perf traces/火焰图 map to source without
#     paying full DWARF size in a container image.
# ---------------------------------------------------------------------------
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = "line-tables-only"
incremental = false

# Release-with-symbols variant used by `yarn bench` (kept separate so the
# shippable release stays stripped).
[profile.profiling]
inherits = "release"
debug = "full"
strip = false
