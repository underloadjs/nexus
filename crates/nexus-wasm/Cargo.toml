# The Node/WASM build of the broker **core**.
#
# What this crate is: the same `PoolActor` + relay + queue + store that the native
# server runs, re-exported to JavaScript through wasm-bindgen. There is no second
# implementation of scheduling here: the JS host drives the real state machine.
#
# What it deliberately is not: a WASM port of the *server*. `axum` and
# `tokio::net` need an I/O driver and a thread pool that `wasm32-unknown-unknown`
# does not provide, and there is no listener inside a WASM module to accept a
# socket. So the runtime boundary is explicit (README "WASM boundary"):
#
#   native  : sockets, HTTP, SSE, timers, disk artifacts  ->  actor messages
#   wasm    : actor messages in, effects out              ->  JS does the I/O
#
[package]
name = "nexus-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Nexus broker core compiled for the wasm32-unknown-unknown boundary (Node + browser)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nexus-core = { path = "../nexus-core" }
wasm-bindgen = "0.2"
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
