# A dependency-light Rust worker client that dials out to the hub.
#
# Not part of the broker itself: it is the reference *client* for task §12, and the
# thing that would be ported to a single Python cell for a molab/Kaggle notebook.
# Kept in the workspace so `cargo check --workspace` proves the protocol types are
# usable from a client, not only from the server.
[package]
name = "nexus-worker-example"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Outbound-dial worker client for the nexus hub (loopback engine front)."

[dependencies]
nexus-core = { path = "../nexus-core" }
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
serde_json.workspace = true
anyhow.workspace = true

[lints]
workspace = true
